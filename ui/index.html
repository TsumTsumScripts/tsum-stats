<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsum Tsum Stats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f0a92a' stroke='%23b5561a' stroke-width='3'/%3E%3C/svg%3E">
<script type="module" src="/src/main.js"></script>
<!-- The chosen theme (themes/*.css, else Halloween: DEFAULT_THEME in ui.svelte.js) goes after the built-in styles; set here so the page never draws in the wrong one. -->
<link rel="stylesheet" id="theme-css">
<script>
  try {
    const t = JSON.parse(localStorage.getItem('tsum-stats.theme') || 'null') || 'halloween.css';
    document.getElementById('theme-css').href = 'themes/' + String(t).replace(/[\\/]/g, '');
  } catch {
    document.getElementById('theme-css').href = 'themes/halloween.css';
  }
</script>
</head>
<body>
<div id="app"></div>
</body>
</html>
